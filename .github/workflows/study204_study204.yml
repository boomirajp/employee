# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy JAR app to Azure Web App - study204

on:
  push:
    branches:
      - study204
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read #This is required for actions/checkout      
    
      
    steps:
      - uses: actions/checkout@v4

        env:
          USERNAME: ${{ vars.AZ204_USERNAME }}
          PASSWORD: ${{ vars.AZ204_PASSWORD }}

      - name: PRINT DB DATA
        run: echo "DB DETAILS- $USERNAME"

      - name: Set up Java version
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'
          
      

      - name: Build with Maven
        run: mvn clean install

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: java-app
          path: '${{ github.workspace }}/target/*.jar'

  deploy:
    runs-on: windows-latest
    needs: build
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: java-app

        env:
          USERNAME: ${{ vars.AZ204_USERNAME }}
          PASSWORD: ${{ vars.AZ204_PASSWORD }}
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_89DD082EEA654C62AB3EEE27E26BDBCE }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_67D20FA17F7F4F399BD9939160227FE5 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_63929D546CA2431698B9244C47DB8D55 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'study204'
          slot-name: 'Production'
          package: '*.jar'
          
